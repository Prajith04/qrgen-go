# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25.0'

    - name: Build
      run: go build -o qrgen

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25.0'

    - name: Build for Linux (amd64)
      run: GOOS=linux GOARCH=amd64 go build -o qrgen-linux-amd64

    - name: Build for macOS (amd64)
      run: GOOS=darwin GOARCH=amd64 go build -o qrgen-darwin-amd64

    - name: Build for Windows (amd64)
      run: GOOS=windows GOARCH=amd64 go build -o qrgen-windows-amd64.exe

    - name: Publish GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create ${{ github.ref_name }} \
          qrgen-linux-amd64 \
          qrgen-darwin-amd64 \
          qrgen-windows-amd64.exe \
          --title "Release ${{ github.ref_name }}" \
          --generate-notes
